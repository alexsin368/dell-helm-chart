apiVersion: batch/v1
kind: Job
metadata:
  name: enterpriseinference-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: enterpriseinference-sa
      containers:
      - name: setup
        image: alpine/git
        command: ["/bin/sh", "-c", "/scripts/ei-setup.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: workspace
          mountPath: /workspace
      restartPolicy: OnFailure
      volumes:
      - name: scripts
        configMap:
          name: enterpriseinference-scripts
      - name: workspace
        persistentVolumeClaim:
          claimName: enterpriseinference-pvc