apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterpriseinference-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterpriseinference-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enterpriseinference-role
subjects:
- kind: ServiceAccount
  name: enterpriseinference-sa
  namespace: {{ .Release.Namespace }}